<!doctype html>
<html lang="ru" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chess Stats — аналитика chess.com</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar navbar-dark mb-4">
    <div class="container">
      <span class="navbar-brand fw-semibold">♟ <span class="accent">Chess</span> Stats</span>
      <div class="d-flex align-items-center gap-3">
        <span class="navbar-text small d-none d-sm-inline">аналитика по открытому API chess.com</span>
        <button type="button" id="themeToggle" class="btn btn-sm btn-outline-secondary" title="Переключить тему">🌙</button>
      </div>
    </div>
  </nav>

  <main class="container pb-5">

    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h1 class="h4 mb-1">Анализ игрока</h1>
        <p class="text-muted mb-3">Вставьте ник или ссылку на профиль chess.com</p>
        <form id="searchForm" class="row g-2 align-items-end">
          <div class="col-12 col-md-7 col-lg-8">
            <label class="form-label small text-muted mb-1" for="playerInput">Ник или ссылка</label>
            <input id="playerInput" type="text" class="form-control form-control-lg"
                   placeholder="hikaru или https://www.chess.com/member/hikaru" autocomplete="off">
          </div>
          <div class="col-6 col-md-3 col-lg-2">
            <label class="form-label small text-muted mb-1" for="monthsSelect">Период игр</label>
            <select id="monthsSelect" class="form-select form-select-lg">
              <option value="3">3 мес</option>
              <option value="6">6 мес</option>
              <option value="12" selected>12 мес</option>
              <option value="24">24 мес</option>
              <option value="all">Вся история</option>
            </select>
          </div>
          <div class="col-6 col-md-2 d-grid">
            <button type="submit" class="btn btn-primary btn-lg" id="analyzeBtn">Анализировать</button>
          </div>
        </form>
        <div class="form-check form-check-inline mt-3 mb-0">
          <input class="form-check-input" type="checkbox" id="refreshCheck">
          <label class="form-check-label small text-muted" for="refreshCheck">Принудительно обновить (игнорировать кэш)</label>
        </div>
        <div id="historyChips" class="mt-3 d-flex flex-wrap gap-2 align-items-center"></div>
      </div>
    </div>

    <div id="status" class="mb-3" hidden>
      <div class="d-flex align-items-center gap-2 text-muted">
        <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
        <span id="statusText">Загружаем…</span>
      </div>
    </div>

    <div id="errorBox" class="alert alert-danger" role="alert" hidden></div>

    <div id="results" hidden>
      <section id="profileSection" class="mb-4"></section>
      <section id="ratingSection" class="mb-4"></section>
      <section id="summarySection" class="mb-4"></section>
      <section id="compareSection" class="mb-4"></section>
      <section id="tacticsSection" class="mb-4"></section>
      <section id="overviewSection" class="mb-4"></section>
      <section id="formSection" class="mb-4"></section>
      <section id="volumeSection" class="mb-4"></section>
      <section id="bestTimeSection" class="mb-4"></section>
      <section id="weaknessSection" class="mb-4"></section>
      <section id="strongPointsSection" class="mb-4"></section>
      <section id="stagesSection" class="mb-4"></section>
      <section id="strengthSection" class="mb-4"></section>
      <section id="openingsSection" class="mb-4"></section>
      <section id="repertoireSection" class="mb-4"></section>
      <section id="adviceSection" class="mb-4"></section>
      <section id="timeSection" class="mb-4"></section>
      <section id="opponentsSection" class="mb-4"></section>
      <section id="lostSection" class="mb-4"></section>
      <section id="recentSection" class="mb-4"></section>
      <section id="bestGamesSection" class="mb-4"></section>
    </div>

  </main>

  <footer class="text-center text-muted small pb-4">
    Данные — открытое API chess.com. Хранятся локально в формате JSON (папка <code>data/</code>).
  </footer>

  <div class="modal fade" id="openingModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="openingModalTitle">Дебют</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
        </div>
        <div class="modal-body" id="openingModalBody"></div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="opponentModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="opponentModalTitle">Соперник</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
        </div>
        <div class="modal-body" id="opponentModalBody"></div>
      </div>
    </div>
  </div>

  <script src="vendor/chart.umd.min.js"></script>
  <script src="vendor/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
